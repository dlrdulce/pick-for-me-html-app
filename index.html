<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="1.2.0">
<title>Pick For Me</title>
<meta name="theme-color" content="#0A0A0B">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap">
<style>
:root{--paper:#0A0A0B;--surface:#131316;--field:#1A1A1E;--line:#26262C;--line-strong:#3A3A42;--ink:#F2F2F4;--muted:#7C7C84;--accent:#F0B429;--onb:#0A0A0B;--ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font:15px/1.5 Sora,system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:24px 18px 110px}
.htop{display:flex;align-items:center;gap:10px;margin:0 0 4px}
h1{font-size:1.85rem;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:1.05rem;font-weight:700;margin:0 0 12px}
.lede{color:var(--muted);margin:0 0 22px;font-size:.9rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--onb);font-weight:600}
.chip.pack{color:var(--ink);border-color:var(--line-strong)}
.add{display:flex;gap:8px;margin-bottom:20px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
input:focus{outline:none;border-color:var(--line-strong)}
input::placeholder{color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid transparent;min-height:44px;transition:background .2s var(--ease),transform .12s var(--ease)}
.btn.main{background:var(--ink);color:var(--onb)}
.btn.main:disabled{opacity:.4;cursor:not-allowed}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.82rem}
.btn:active:not(:disabled){transform:scale(.96)}
.ver{font:inherit;font-size:.7rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.stage{position:relative;width:min(100%,300px);aspect-ratio:1;margin:8px auto 20px;touch-action:none}
.stage canvas{width:100%;height:100%;display:block}
.ptr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--accent);transform-origin:50% 0%;transition:transform .1s}
.ptr.tap{transform:translateX(-50%) translateY(-2px) scale(1.06)}
.spin{width:100%;font-size:1rem;min-height:52px}
.result{border:1px solid var(--line-strong);border-radius:12px;padding:20px 16px;text-align:center;margin:0 0 16px;background:var(--surface);animation:cardIn .45s var(--spring)}
@keyframes cardIn{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.result .big{font-size:1.7rem;font-weight:700;margin:6px 0 2px;word-break:break-word}
.result .row{justify-content:center;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.winner{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line-strong)}
.winner .wlab{font-size:.7rem;color:var(--accent);text-transform:uppercase;letter-spacing:.18em;font-weight:700;margin-bottom:8px}
.winner .wname{font-size:1.9rem;font-weight:800;color:var(--accent);word-break:break-word;line-height:1.15}
.trophyBox{width:150px;height:150px;display:block;margin:0 auto 4px;position:relative}
.trophyBox:empty::before{content:'🏆';font-size:80px;display:flex;align-items:center;justify-content:center;height:100%}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 14px;margin:0 0 6px}
.opt span{word-break:break-word;flex:1;font-size:.95rem}
.wbtn{font:inherit;font-weight:700;font-size:.75rem;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer;min-height:28px}
.wbtn.on{background:var(--accent);border-color:var(--accent);color:var(--onb)}
.hint{min-height:1.4em;font-size:.85rem;color:var(--muted);margin:8px 0 0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 8px}
.item .t{display:flex;justify-content:space-between;gap:10px;cursor:pointer;background:none;border:0;color:inherit;font:inherit;text-align:left;width:100%;padding:0}
.item b{font-size:.98rem;font-weight:600}
.meta{color:var(--muted);font-size:.8rem;margin:3px 0 0}
.edit{margin-top:12px;display:grid;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile .v{font-size:1.5rem;font-weight:700;line-height:1.1}
.tile .l{color:var(--muted);font-size:.78rem;margin-top:2px}
.empty{color:var(--muted);font-size:.9rem}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,11,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;font:inherit;font-size:.68rem;background:none;border:0;color:var(--muted);padding:10px 2px;min-height:56px;cursor:pointer}
nav button .ic{display:block;font-size:1.2rem;line-height:1.2;margin-bottom:2px}
nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.lab{font-weight:600;font-size:.85rem;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lab.flex{display:flex;justify-content:space-between;align-items:center}
.tog{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:.88rem;cursor:pointer}
.tog input{flex:none;width:20px;height:20px;min-height:0;padding:0;accent-color:var(--accent)}
.pt{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 6px 6px 14px;background:var(--surface);font-weight:600;font-size:.9rem}
.pt.on{background:var(--ink);border-color:var(--ink);color:var(--onb)}
.seg{display:flex;flex:none}
.seg button{font:inherit;font-weight:600;font-size:.85rem;color:var(--muted);background:var(--field);border:1px solid var(--line);padding:8px 14px;min-height:44px;cursor:pointer}
.seg button+button{margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--onb);position:relative;z-index:1}
#bmode{display:flex;width:100%;margin-bottom:6px}
#bmode button{flex:1;padding:10px 4px;font-size:.8rem}
.orow{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.orow span{flex:1;font-weight:600}
.orow input{flex:none;width:9rem}
[hidden]{display:none!important}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:0 0 16px}
.mcard{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:18px 12px;text-align:center;font-weight:600;min-height:70px;display:flex;align-items:center;justify-content:center;word-break:break-word}
.mcard.hl{background:var(--ink);border-color:var(--ink);color:var(--onb)}
.vs{font-weight:700;color:var(--muted);font-size:.78rem;letter-spacing:.1em}
.round{margin:0 0 14px}
.round h3{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
.rrow{display:flex;gap:6px;flex-wrap:wrap}
.rp{font-size:.78rem;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.rp.w{background:var(--ink);color:var(--onb);border-color:var(--ink);font-weight:600}
.rp.champ{background:var(--accent);color:var(--onb);border-color:var(--accent);font-weight:700}
.receipt{background:var(--surface);border-radius:10px;padding:16px 18px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;margin:12px 0;border:1px solid var(--line)}
.receipt .line{display:flex;justify-content:space-between;padding:3px 0;gap:10px}
.receipt .sep{border-top:1px dashed var(--line-strong);margin:8px 0}
.receipt .tot{font-weight:700;color:var(--ink)}
.receipt .ttl{text-align:center;font-weight:600;letter-spacing:.15em;margin:0 0 12px;color:var(--muted);font-size:.72rem}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;opacity:.35}
.ach.un{opacity:1;border-color:var(--line-strong)}
.ach .ai{font-size:1.5rem;filter:grayscale(1) brightness(1.4)}
.ach.un .ai{filter:none}
.ach .an{font-weight:600;font-size:.72rem;margin-top:6px}
.ach .ad{color:var(--muted);font-size:.62rem;line-height:1.25;margin-top:3px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar div{height:100%;background:var(--ink);border-radius:3px;transition:width .5s var(--ease)}
.objtimer{margin-top:12px}
.objtimer .barwrap{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.objtimer .barwrap div{height:100%;background:var(--accent);width:100%;transition:width 1s linear}
.patchmodal{position:fixed;inset:0;z-index:20;background:rgba(10,10,11,.85);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}
.patchsheet{background:var(--surface);border-top:1px solid var(--line-strong);border-radius:16px 16px 0 0;padding:22px 20px calc(30px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:85vh;overflow-y:auto}
.patchsheet .handle{width:36px;height:4px;background:var(--line-strong);border-radius:2px;margin:-8px auto 16px}
.patchsheet h2{margin:0 0 2px}
.patchsheet .sub{color:var(--muted);font-size:.8rem;margin:0 0 20px}
.pnote{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.pnote:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.pnote h3{font-size:.95rem;margin:0 0 2px;color:var(--ink);font-weight:700}
.pnote .pdate{font-size:.72rem;color:var(--muted);margin:0 0 12px}
.pnote ul{margin:0;padding-left:0;list-style:none}
.pnote li{font-size:.85rem;padding:4px 0 4px 18px;position:relative;line-height:1.5}
.pnote li:before{content:'';position:absolute;left:2px;top:.85em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.pnote.cur h3{color:var(--accent)}
.pnote.cur li:before{background:var(--accent)}
.pnote .vbadge{display:inline-block;font-size:.65rem;font-weight:600;color:var(--muted);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:middle}
.pnote.cur .vbadge{color:var(--accent);border-color:var(--accent)}
main{animation:tabIn .35s var(--ease) both}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
<main id="decide">
<div class="htop"><h1>Pick For Me</h1><button class="ver" id="verBtn" type="button">v1.2.0</button></div>
<p class="lede">Add your options, spin, and let the wheel decide.</p>
<label class="lab" for="opt">Options</label>
<div class="add"><input id="opt" maxlength="60" placeholder="Add an option..."><button class="btn main" id="addBtn">Add</button></div>
<div class="lab flex">Quick packs <button class="btn line sm" id="savePack">Save current</button></div>
<div class="chips" id="packs"></div>
<label class="tog"><input type="checkbox" id="elim"> Elimination mode: each winner leaves the wheel</label>
<label class="tog"><input type="checkbox" id="myst"> Mystery mode: hide labels until it lands</label>
<label class="tog"><input type="checkbox" id="fate"> Fate mode: 10s to object, then it's final</label>
<label class="tog"><input type="checkbox" id="snd" checked> Sound and vibration</label>
<div id="wheelBox"></div>
<div id="result" class="result" hidden></div>
<button class="btn main spin" id="spin">Spin the wheel</button>
<p class="hint" id="msg" role="status"></p>
<div id="opts" style="margin-top:16px"></div>
</main>
<main id="bracket" hidden><h2>Bracket</h2><p class="lede">Head-to-head tournament. Winner of each matchup advances.</p><div id="brWrap"></div></main>
<main id="bill" hidden>
<h2>Who pays the bill?</h2>
<label class="lab" for="amt">Bill amount</label>
<div class="add"><div class="seg" id="cur"></div><input id="amt" type="number" inputmode="decimal" min="0" placeholder="0.00"></div>
<div class="lab">Service charge</div><div class="chips" id="scs"></div>
<div class="add"><input id="scv" type="number" inputmode="decimal" min="0" placeholder="Custom service charge"><div class="seg" id="scu"></div></div>
<div class="lab">Tip</div><div class="chips" id="tips"></div>
<div class="lab">Who is at the table?</div>
<div class="add"><input id="pn" maxlength="24" placeholder="Add a name..."><button class="btn main" id="pnAdd">Add</button></div>
<div class="row" id="people"></div>
<div id="own" hidden></div>
<div class="lab">How to pay</div><div class="seg" id="bmode"></div>
<p class="hint" id="sum"></p>
<button class="btn main spin" id="billGo" style="margin-top:10px">Split it</button>
<p class="hint" id="bmsg" role="status"></p>
<div id="bres" hidden aria-live="polite"></div>
</main>
<main id="history" hidden><h2>History</h2><div class="chips" id="hfilter"></div><div id="hlist"></div></main>
<main id="stats" hidden><h2>Stats</h2><div id="slist"></div></main>
</div>
<canvas id="conf" hidden aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:5"></canvas>
<nav aria-label="Main"><div id="nav"></div></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
const VERSION='1.2.0';
const PATCH_NOTES=[
  {v:'1.2.0',date:'Oct 5, 2026',title:'External trophy (GitHub Pages)',items:['Trophy loads from ./trophy.json over HTTP','Works on GitHub Pages','Upload trophy.json next to index.html','Emoji fallback if trophy fails to load']},
  {v:'1.1.1',date:'Oct 5, 2026',title:'Self-contained attempt',items:['Attempted embedded JSON approach']},
  {v:'1.0.7',date:'Oct 5, 2026',title:'Motion',items:['Smooth animations throughout']},
  {v:'1.0.6',date:'Oct 5, 2026',title:'Winner block',items:['Big amber winner block on final elimination']}
];
const COLORS=['#2A2A32','#333340','#1F1F26','#38384A','#26262E','#2E2E3A','#1C1C22','#34343F','#292932','#3A3A48'];
const CONFETTI=['#F0B429','#F2F2F4','#7C7C84','#3A3A42','#5CC98D'];
const CURS=[['₱','PHP'],['$','USD'],['€','EUR'],['£','GBP'],['¥','JPY'],['S$','SGD'],['A$','AUD'],['C$','CAD'],['₹','INR']];
const TAU=Math.PI*2;
const PACKS={'What to eat':{cat:'Food',o:['Adobo','Sinigang','Sisig','Lechon kawali','Pancit','Kare-kare','Tinola']},'Weekend plan':{cat:'Fun',o:['Basketball','Movie night','Road trip','Rest at home','Try a new cafe','Visit family']},'Who pays':{cat:'General',o:['Me','You','Split it','Rock-paper-scissors']},'Truth or dare':{cat:'Fun',o:['Truth','Dare','Pass','Double dare']}};
const DEFAULTS={decisions:[],options:[],weights:{},people:[],packs:{},elim:false,snd:true,myst:false,fate:false,amt:'',tip:0,sc:0,scv:'',scu:'%',bmode:'split',own:{},currency:'PHP',bracket:null,objCount:0,ach:{}};
let S=JSON.parse(JSON.stringify(DEFAULTS));
let cat='General',filter='All',tab='decide',spinning=false,rot=0,openId=null,cur=null,after='',lastTick=-1,ac=null,drumStop=null,objTimer=null,brBusy=false,brHl=null,busy=false;
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=iso=>new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const money=x=>{const c=CURS.find(c=>c[1]===S.currency)||CURS[0];return c[0]+Number(x||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})};
function save(){try{localStorage.setItem('pick-for-me-v2',JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem('pick-for-me-v2');if(r){const d=JSON.parse(r);S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),d)}}catch(e){}}
function audio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tick(sp){if(!S.snd||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.value=480+Math.min(1,sp||0)*900;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.035);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.05)}catch(e){}}
function drumroll(){if(!S.snd||!ac)return null;try{const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const src=ac.createBufferSource();src.buffer=buf;src.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=350;const g=ac.createGain();g.gain.setValueAtTime(.001,ac.currentTime);g.gain.linearRampToValueAtTime(.05,ac.currentTime+3);src.connect(f);f.connect(g);g.connect(ac.destination);src.start();return()=>{try{g.gain.cancelScheduledValues(ac.currentTime);g.gain.setValueAtTime(g.gain.value,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.08);src.stop(ac.currentTime+.15)}catch(e){}}}catch(e){return null}}
function tapPtr(){const p=document.querySelector('.ptr');if(!p)return;p.classList.remove('tap');void p.offsetWidth;p.classList.add('tap');clearTimeout(tapPtr._t);tapPtr._t=setTimeout(()=>p.classList.remove('tap'),110)}
function celebrate(){if(S.snd&&navigator.vibrate)navigator.vibrate([40,30,80]);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=$('conf'),w=cv.width=innerWidth,h=cv.height=innerHeight,c=cv.getContext('2d');cv.hidden=false;const P=Array.from({length:70},()=>({x:w/2,y:h*.35,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,s:4+Math.random()*4,c:CONFETTI[Math.floor(Math.random()*CONFETTI.length)],r:Math.random()*6}));const t0=performance.now();(function f(now){c.clearRect(0,0,w,h);P.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=.2;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);c.restore()});if(now-t0<1800)requestAnimationFrame(f);else{c.clearRect(0,0,w,h);cv.hidden=true}})(t0)}
function chipRow(box,list,get,set){box.textContent='';list.forEach(c=>{const b=el('button','chip',c);b.type='button';b.setAttribute('aria-pressed',String(get()===c));b.onclick=()=>set(c);box.appendChild(b)})}
function renderFilter(){const used=[...new Set(S.decisions.map(d=>d.category))];const list=['All',...used];if(!list.includes(filter))filter='All';chipRow($('hfilter'),list,()=>filter,c=>{filter=c;renderFilter();renderHistory()})}
function renderPacks(){const b=$('packs');b.textContent='';const all={...PACKS,...(S.packs||{})};Object.keys(all).forEach(k=>{const p=all[k];const x=el('button','chip pack',k);x.type='button';x.onclick=()=>{if(spinning)return;S.options=[...p.o];S.weights={};cat=p.cat||'General';save();renderOpts();renderWheel();$('result').hidden=true;$('msg').textContent='Loaded "'+k+'". Spin!'};if(S.packs&&S.packs[k])x.oncontextmenu=e=>{e.preventDefault();if(confirm('Delete pack "'+k+'"?')){delete S.packs[k];save();renderPacks()}};b.appendChild(x)})}
function weightOf(n){return S.weights[n]||1}
function cycleWeight(n){if(spinning)return;const w=weightOf(n);S.weights[n]=w>=3?1:w+1;if(S.weights[n]===1)delete S.weights[n];save();renderOpts();renderWheel()}

const ownSum=()=>S.people.reduce((x,p)=>x+(parseFloat(S.own[p])||0),0);
function ownRows(){const b=$('own');b.hidden=S.bmode!=='custom';b.textContent='';if(S.bmode!=='custom')return;b.appendChild(el('p','meta','Enter what each person ordered. Anything left over (like shared dishes) is split equally.'));S.people.forEach(p=>{const r=el('div','orow');r.appendChild(el('span',null,p));const i=document.createElement('input');i.type='number';i.min='0';i.inputMode='decimal';i.placeholder='0.00';i.value=S.own[p]||'';i.oninput=()=>{S.own[p]=i.value;save();renderSum()};r.appendChild(i);b.appendChild(r)})}
function renderSum(){const{a,total}=calc(),n=S.people.length;let t=a?'Total with tip: '+money(total)+(n&&S.bmode!=='custom'?' ('+money(total/n)+' each if split equally)':''):'Enter the bill amount to see the split.';if(S.bmode==='custom'&&a){const u=ownSum(),sh=a-u;t+=sh<0?'. Orders add up to '+money(u)+', more than the bill.':'. Shared: '+money(sh)+(n?' ('+money(sh/n)+' each)':'')}$('sum').textContent=t}
function receipt(lines,big){const r=el('div','receipt');r.appendChild(el('div','ttl','PICK FOR ME'));lines.forEach(l=>{if(l==='---'){r.appendChild(el('div','sep'));return}if(Array.isArray(l)){const d=el('div','line'+(l[2]?' tot':''));d.appendChild(el('span',null,l[0]));d.appendChild(el('span',null,l[1]));r.appendChild(d)}else{r.appendChild(el('div','line',l))}});if(big){r.appendChild(el('div','sep'));const d=el('div','line tot');d.appendChild(el('span',null,'TOTAL'));d.appendChild(el('span',null,big));r.appendChild(d)}return r}
function showBill(lines,big,shareStr){const r=$('bres');r.textContent='';r.hidden=false;r.appendChild(receipt(lines,big));if(shareStr){const row=el('div','row');const sb=el('button','btn line sm','Share');sb.type='button';sb.onclick=()=>shareText(shareStr);row.appendChild(sb);r.appendChild(row)}}
async function billGo(){if(busy)return;const{a,t,c,total}=calc(),n=S.people.length,m=$('bmsg');$('bres').hidden=true;m.textContent='';if(!a){m.textContent='Enter the bill amount first.';return}if(n<2){m.textContent='Add at least 2 names.';return}const lines=[['Bill',money(a)]];if(c)lines.push(['Service'+(svcPct()!==null?' ('+svcPct()+'%)':''),money(c)]);if(t)lines.push(['Tip ('+S.tip+'%)',money(t)]);if(S.bmode==='split'){const each=total/n;showBill([...lines,'---',['Split between',n+' people']],money(each),'Dinner '+money(total)+' ÷ '+n+' = '+money(each)+' each');return}if(S.bmode==='custom'){const u=ownSum();if(u>a){m.textContent='Orders add up to '+money(u)+', which is more than the bill.';return}const sh=(a-u)/n,f=total/a;const perLines=[...lines,'---'];S.people.forEach(x=>{const amt=((parseFloat(S.own[x])||0)+sh)*f;perLines.push([x,money(amt)])});perLines.push('---',['Shared',money(sh)+' ÷ '+n]);showBill(perLines,money(total),'Bill split');return}busy=true;$('billGo').disabled=true;audio();const w=Math.floor(Math.random()*n);const steps=n*Math.ceil(18/n)+n*Math.floor(Math.random()*3)+w;for(let i=0;i<=steps;i++){renderPeople(i%n);tick(1-i/steps);await new Promise(r=>setTimeout(r,Math.min(520,55*Math.pow(1.08,i))))}busy=false;$('billGo').disabled=false;renderPeople(w);const name=S.people[w];celebrate();if(S.bmode==='all'){showBill([...lines,'---',[name+' pays',money(total)]],money(total),name+' pays the whole bill: '+money(total))}else{const each=total/(n-1);showBill([...lines,'---',[name,'FREE'],['Others pay',money(each)+' each']],money(each),name+' eats free! Others pay '+money(each)+' each.')}S.decisions.unshift({id:Date.now().toString(36),options:[...S.people],chosen:name,category:'Bill',createdAt:new Date().toISOString(),note:(S.bmode==='all'?'Pays ':'Eats free, bill ')+money(total)});checkAch();save()}
function addPerson(){if(busy)return;const v=$('pn').value.trim();if(!v)return;if(S.people.some(x=>x.toLowerCase()===v.toLowerCase())){$('bmsg').textContent='That name is already on the list.';return}S.people.push(v);$('pn').value='';$('bmsg').textContent='';save();renderBill()}

/* TROPHY PLAYER — loads ./trophy.json over HTTP (works on GitHub Pages) */
window.playTrophy = (function(){
  let anim = null;
  return function(box){
    if(!box) return;
    if(typeof lottie === 'undefined'){
      console.warn('Trophy: lottie-web not loaded');
      return;
    }
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    try{
      box.innerHTML = '';
      anim = lottie.loadAnimation({
        container: box,
        renderer: 'svg',
        loop: false,
        autoplay: true,
        path: './trophy.json'
      });
      anim.addEventListener('data_failed', ()=>console.warn('Trophy: trophy.json not found. Make sure it is in the same folder as index.html.'));
      anim.addEventListener('error', (e)=>console.warn('Trophy error:', e));
      console.log('%cTrophy loading from ./trophy.json','color:#F0B429');
    }catch(e){
      console.warn('Trophy failed:', e);
    }
  };
})();

function showPatchNotes(){
  const bg=el('div','patchmodal'),sheet=el('div','patchsheet');
  sheet.appendChild(el('div','handle'));
  sheet.appendChild(el('h2',null,"What's new"));
  sheet.appendChild(el('p','sub','Pick For Me · v'+VERSION));
  PATCH_NOTES.forEach((p,i)=>{
    const note=el('div','pnote'+(i===0?' cur':''));
    const h=el('h3',null,p.title);h.appendChild(el('span','vbadge','v'+p.v));note.appendChild(h);
    note.appendChild(el('p','pdate',p.date));
    const ul=el('ul');p.items.forEach(x=>{const li=document.createElement('li');li.textContent=x;ul.appendChild(li)});
    note.appendChild(ul);sheet.appendChild(note);
  });
  const c=el('button','btn main','Got it');c.type='button';c.style.cssText='width:100%;margin-top:20px';
  const close=()=>bg.remove();c.onclick=close;sheet.appendChild(c);bg.appendChild(sheet);
  bg.onclick=e=>{if(e.target===bg)close()};
  document.body.appendChild(bg);
}
function hasUnseen(){try{return localStorage.getItem('pfm-seen')!==VERSION}catch(e){return false}}
function markSeen(){try{localStorage.setItem('pfm-seen',VERSION)}catch(e){}}

$('pnAdd').onclick=addPerson;
$('pn').addEventListener('keydown',e=>{if(e.key==='Enter')addPerson()});
$('amt').addEventListener('input',()=>{S.amt=$('amt').value;save();if(!busy)renderSum()});
$('billGo').onclick=billGo;
$('scv').addEventListener('input',()=>{S.scv=$('scv').value;save();if(!busy)renderBill()});
$('addBtn').onclick=addOpt;
$('opt').addEventListener('keydown',e=>{if(e.key==='Enter')addOpt()});
$('spin').onclick=spin;
$('savePack').onclick=()=>{if(S.options.length<2)return;const name=prompt('Name this pack:');if(!name)return;S.packs=S.packs||{};S.packs[name]={cat:cat,o:[...S.options]};save();renderPacks();$('msg').textContent='Saved pack "'+name+'".'};
$('elim').onchange=e=>{S.elim=e.target.checked;if(S.elim&&cur&&!cur.removed&&!spinning&&!$('result').hidden)removeCur();else save()};
$('snd').onchange=e=>{S.snd=e.target.checked;save()};
$('myst').onchange=e=>{S.myst=e.target.checked;save();renderWheel()};
$('fate').onchange=e=>{S.fate=e.target.checked;save()};
$('verBtn').onclick=showPatchNotes;
let fs=null;
$('wheelBox').addEventListener('pointerdown',e=>{if(e.target.closest('.stage'))fs={x:e.clientX,y:e.clientY,t:performance.now()}});
$('wheelBox').addEventListener('pointerup',e=>{if(!fs)return;const d=Math.hypot(e.clientX-fs.x,e.clientY-fs.y),dt=performance.now()-fs.t;fs=null;if(d>50&&dt<600)spin()});
$('wheelBox').addEventListener('pointercancel',()=>{fs=null});
window.addEventListener('resize',()=>{if(tab==='decide'){if(S.options.length<2)renderWheel();else draw()}});

function init(){
  load();
  if(!S.options.length&&!S.decisions.length){S.options=[...PACKS['What to eat'].o];cat='Food'}
  $('elim').checked=S.elim;$('snd').checked=S.snd;$('myst').checked=S.myst;$('fate').checked=S.fate;
  buildNav();renderPacks();renderOpts();show('decide');
  if(!S.decisions.length&&hasUnseen())setTimeout(()=>{showPatchNotes();markSeen()},600);
}
init();
</script>
