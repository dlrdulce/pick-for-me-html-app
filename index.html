<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick For Me</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<style>
:root{--paper:#F4F5FA;--ink:#1B2040;--muted:#5E6584;--brand:#3F4BB8;--onb:#fff;--coral:#E5484D;--line:#D5D9EA;--field:#fff;--good:#1E8449;--bad:#C0392B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10142B;--ink:#E8EAF7;--muted:#9AA1C4;--brand:#7B87F2;--onb:#10142B;--line:#2A3158;--field:#1A2040;--good:#4CC38A;--bad:#EE7B6E}}
:root[data-theme="dark"]{--paper:#10142B;--ink:#E8EAF7;--muted:#9AA1C4;--brand:#7B87F2;--onb:#10142B;--line:#2A3158;--field:#1A2040;--good:#4CC38A;--bad:#EE7B6E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Sora,system-ui,-apple-system,'Segoe UI',sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:24px 18px 110px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:1.2rem;font-weight:800;margin:0 0 12px}
.lede{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex:none;font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:20px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--onb);font-weight:600}
.add{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;border:2px solid transparent;min-height:46px}
.btn.main{background:var(--brand);color:var(--onb)}
.btn.main:disabled{opacity:.6}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.stage{position:relative;width:min(100%,320px);aspect-ratio:1;margin:6px auto 16px}
.stage canvas{width:100%;height:100%;display:block}
.ptr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--coral);filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.ready{text-align:center;color:var(--muted);padding:40px 10px;border:1.5px dashed var(--line);border-radius:16px;margin-bottom:16px}
.spin{width:100%;font-size:1.05rem;min-height:54px}
.result{border:2px solid var(--brand);border-radius:16px;padding:16px;text-align:center;margin:0 0 16px;background:var(--field)}
.result .big{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;margin:4px 0 2px;word-break:break-word}
.result .row{justify-content:center;margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin:0 0 8px}
.opt span{word-break:break-word}
.hint{min-height:1.4em;font-size:.92rem;color:var(--muted);margin:8px 0 0}
.item{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.item .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer;background:none;border:0;color:inherit;font:inherit;text-align:left;width:100%;padding:0}
.item b{font-size:1.05rem}
.meta{color:var(--muted);font-size:.85rem;margin:3px 0 0}
.tag{font-weight:600;font-size:.85rem;flex:none}
.tag.good{color:var(--good)}.tag.bad{color:var(--bad)}.tag.none{color:var(--muted);font-weight:400}
.edit{margin-top:12px;display:grid;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.tile{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .v{font-size:1.7rem;font-weight:800;line-height:1.1}
.tile .l{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--field);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;font:inherit;font-size:.82rem;background:none;border:0;color:var(--muted);padding:10px 4px;min-height:58px;cursor:pointer}
nav button .ic{display:block;font-size:1.3rem;line-height:1.2}
nav button[aria-current="page"]{color:var(--brand);font-weight:600}
.lab{font-weight:600;font-size:.9rem;margin:0 0 6px;color:var(--muted)}
.tog{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:.92rem;cursor:pointer}
.tog input{flex:none;width:22px;height:22px;min-height:0;padding:0;accent-color:var(--brand)}
.stage{touch-action:none}
.pt{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;background:var(--field);font-weight:600}
.pt.on{background:var(--brand);border-color:var(--brand);color:var(--onb)}
.pt .btn{padding:0 8px;min-height:28px}
.seg{display:flex;flex:none}
.seg button{font:inherit;font-weight:600;color:var(--ink);background:var(--field);border:1.5px solid var(--line);padding:8px 14px;min-height:46px;cursor:pointer}
.seg button+button{margin-left:-1.5px}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--onb);position:relative;z-index:1}
.seg button:focus-visible{outline:3px solid var(--coral);outline-offset:2px;position:relative;z-index:2}
#bmode{display:flex;width:100%;margin-bottom:6px}#bmode button{flex:1;padding:10px 4px;font-size:.85rem}
#people{margin:6px 0 14px}
.orow{display:flex;align-items:center;gap:10px;margin:0 0 8px}.orow span{flex:1;font-weight:600;word-break:break-word}.orow input{flex:none;width:9rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<main id="decide">
<h1>Pick For Me</h1>
<p class="lede">Add your options, spin, and let the wheel decide.</p>
<div class="chips" id="cats" role="group" aria-label="Category"></div>
<div class="add"><input id="opt" maxlength="60" placeholder="Add an option..." aria-label="New option"><button class="btn main" id="addBtn" aria-label="Add option">Add</button></div>
<div class="lab">Quick packs</div><div class="chips" id="packs"></div>
<label class="tog"><input type="checkbox" id="elim"> Elimination mode: each winner leaves the wheel</label>
<label class="tog"><input type="checkbox" id="snd" checked> Sound and vibration</label>
<div id="wheelBox"></div>
<div id="result" class="result" hidden></div>
<button class="btn main spin" id="spin">Spin the wheel</button>
<p class="hint" id="msg" role="status"></p>
<div id="opts" style="margin-top:14px"></div>
</main>

<main id="history" hidden>
<h2>History</h2>
<div class="chips" id="hfilter" role="group" aria-label="Filter by category"></div>
<div id="hlist"></div>
</main>

<main id="bill" hidden>
<h2>Who pays the bill?</h2>
<label class="lab" for="amt">Bill amount (₱)</label>
<input id="amt" type="number" inputmode="decimal" min="0" placeholder="0.00" style="flex:none;width:100%">
<div class="lab" style="margin-top:14px">Service charge <span class="sub">(percent of the bill)</span></div><div class="chips" id="scs"></div>
<div class="add"><input id="scv" type="number" inputmode="decimal" min="0" placeholder="Custom service charge" aria-label="Custom service charge"><div class="seg" id="scu" role="group" aria-label="Service charge unit"></div></div>
<div class="lab">Tip</div><div class="chips" id="tips"></div>
<div class="lab">Who is at the table?</div>
<div class="add"><input id="pn" maxlength="24" placeholder="Add a name..." aria-label="Add a name"><button class="btn main" id="pnAdd">Add</button></div>
<div class="row" id="people"></div>
<div id="own" hidden></div>
<div class="lab">How to pay</div><div class="seg" id="bmode" role="group" aria-label="How to pay"></div>
<p class="hint" id="sum"></p>
<button class="btn main spin" id="billGo" style="margin-top:10px">Split it</button>
<p class="hint" id="bmsg" role="status"></p>
<div id="bres" class="result" hidden aria-live="polite"></div>
</main>

<main id="stats" hidden>
<h2>Stats</h2>
<div id="slist"></div>
</main>

</div>

<canvas id="conf" hidden aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:5"></canvas>
<nav aria-label="Main"><div id="nav"></div></nav>

<script>
const CATS=['General','Food','Work','Shopping','Fun','Bill'];
const COLORS=['#3F4BB8','#13807A','#C9601A','#C23B63','#7B45A8','#2F8A4A'];
const TAU=Math.PI*2;
let loaded=0,tg=0,dirty=0,after='',lastTick=-1,ac=null,S={decisions:[],options:[],people:[],elim:false,snd:true},cat='General',filter='All',tab='decide',spinning=false,rot=0,ref=null,openId=null,cur=null;
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const fmt=iso=>new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});

async function persist(){dirty=1;try{if(ref)await ref.set({decisions:S.decisions,options:S.options,people:S.people,elim:S.elim,snd:S.snd});else localStorage.setItem('pick-for-me',JSON.stringify(S))}catch(e){$('msg').textContent='Could not save. Try again.'}}

function chipRow(box,list,get,set){box.textContent='';list.forEach(c=>{const b=el('button','chip',c);b.type='button';b.setAttribute('aria-pressed',String(get()===c));b.onclick=()=>{set(c)};box.appendChild(b)})}
function renderCats(){chipRow($('cats'),CATS,()=>cat,c=>{cat=c;renderCats()})}
function renderFilter(){chipRow($('hfilter'),['All',...CATS],()=>filter,c=>{filter=c;renderFilter();renderHistory()})}

function renderOpts(){
 const b=$('opts');b.textContent='';
 S.options.forEach((o,i)=>{const r=el('div','opt');r.appendChild(el('span',null,o));
  const x=el('button','btn line sm','Remove');x.type='button';x.setAttribute('aria-label','Remove '+o);x.onclick=()=>{if(spinning)return;S.options.splice(i,1);persist();renderOpts();renderWheel()};
  r.appendChild(x);b.appendChild(r)});
}
function renderWheel(){
 const box=$('wheelBox');box.textContent='';
 if(S.options.length<2){const st0=el('div','stage');const c0=document.createElement('canvas');c0.id='wheel0';c0.setAttribute('role','img');c0.setAttribute('aria-label','Empty wheel');st0.appendChild(c0);st0.appendChild(el('div','ptr'));box.appendChild(st0);drawEmpty(c0);box.appendChild(el('p','hint',S.options.length?'Add one more option to start':'Add 2 or more options to start, or tap a Quick pack.'));return}
 const st=el('div','stage');const cv=document.createElement('canvas');cv.id='wheel';cv.setAttribute('role','img');cv.setAttribute('aria-label','Wheel with '+S.options.length+' options');
 st.appendChild(cv);st.appendChild(el('div','ptr'));box.appendChild(st);draw();
}
function drawEmpty(cv){
 const size=cv.clientWidth||300,dpr=window.devicePixelRatio||1;cv.width=cv.height=Math.round(size*dpr);
 const c=cv.getContext('2d');c.scale(dpr,dpr);const r=size/2-6,cx=size/2,n=6,s=TAU/n;
 for(let i=0;i<n;i++){const a0=-Math.PI/2+i*s;c.beginPath();c.moveTo(cx,cx);c.arc(cx,cx,r,a0,a0+s);c.closePath();c.fillStyle=i%2?'rgba(120,130,190,.28)':'rgba(120,130,190,.16)';c.fill();c.strokeStyle='rgba(120,130,190,.5)';c.lineWidth=2;c.stroke()}
 c.beginPath();c.arc(cx,cx,16,0,TAU);c.fillStyle='#fff';c.fill();
}
function draw(){
 const cv=$('wheel');if(!cv)return;const size=cv.clientWidth||300,dpr=window.devicePixelRatio||1;
 cv.width=cv.height=Math.round(size*dpr);const c=cv.getContext('2d');c.scale(dpr,dpr);
 const L=S.options,n=L.length,r=size/2-6,cx=size/2,s=TAU/n;
 for(let i=0;i<n;i++){const a0=rot+i*s;
  c.beginPath();c.moveTo(cx,cx);c.arc(cx,cx,r,a0,a0+s);c.closePath();c.fillStyle=COLORS[i%COLORS.length];c.fill();c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=2;c.stroke();
  c.save();c.translate(cx,cx);c.rotate(a0+s/2);c.fillStyle='#fff';c.font='600 '+Math.max(11,Math.min(15,size/22))+'px Sora,system-ui,sans-serif';c.textAlign='right';c.textBaseline='middle';
  let t=L[i];const mw=r*.66;if(c.measureText(t).width>mw){while(t.length>1&&c.measureText(t+'…').width>mw)t=t.slice(0,-1);t+='…'}
  c.fillText(t,r-14,0);c.restore()}
 c.beginPath();c.arc(cx,cx,16,0,TAU);c.fillStyle='#fff';c.fill();
}

function spin(){
 if(spinning)return;const m=$('msg');
 if(S.options.length<2){m.textContent='Add at least 2 options.';return}
 m.textContent='';$('result').hidden=true;spinning=true;audio();lastTick=-1;$('spin').disabled=true;$('spin').textContent='Spinning...';
 const n=S.options.length,idx=Math.floor(Math.random()*n),s=TAU/n;
 const off=(Math.random()-.5)*s*.7,base=-Math.PI/2-(idx+.5)*s+off,start=((rot%TAU)+TAU)%TAU,delta=((((base-start)%TAU)+TAU)%TAU)+(4+Math.floor(Math.random()*4))*TAU,t0=performance.now(),D=3600+Math.random()*2200;setTimeout(()=>{if(spinning){rot=start+delta;draw();finish(idx)}},D+1500);
 function step(now){const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,4);rot=start+delta*e;const k=Math.floor((((-Math.PI/2-rot)%TAU)+TAU)%TAU/s);if(k!==lastTick){lastTick=k;tick()}draw();if(p<1)requestAnimationFrame(step);else finish(idx)}
 requestAnimationFrame(step);
}
function finish(idx){
 if(!spinning)return;
 rot=((rot%TAU)+TAU)%TAU;spinning=false;$('spin').disabled=false;$('spin').textContent='Spin the wheel';
 cur={id:Date.now().toString(36),options:[...S.options],chosen:S.options[idx],category:cat,createdAt:new Date().toISOString(),rating:null,note:''};
 S.decisions.unshift(cur);
 after='';
 if(S.elim){cur.removed=true;S.options.splice(idx,1);after=S.options.length<2?(S.options.length?'Only '+S.options[0]+' is left. Add more options to keep going.':'No options left.'):'Removed from the wheel. '+S.options.length+' left.';renderOpts();renderWheel()}
 celebrate();showResult();persist();
}
function removeCur(){
 if(spinning||!cur||cur.removed)return;const i=S.options.indexOf(cur.chosen);if(i<0)return;
 cur.removed=true;S.options.splice(i,1);after=S.options.length<2?(S.options.length?'Only '+S.options[0]+' is left. Add more options to keep going.':'No options left.'):'Removed from the wheel. '+S.options.length+' left.';
 renderOpts();renderWheel();showResult();persist();
}
function showResult(msg){
 const r=$('result');r.textContent='';r.hidden=false;
 r.appendChild(el('div','meta','Decision made'));r.appendChild(el('div','big',cur.chosen));r.appendChild(el('div','meta',cur.category));if(after)r.appendChild(el('p','hint',after));
 if(!cur.removed&&!spinning&&S.options.includes(cur.chosen)){const rb=el('button','btn line sm','Remove from wheel');rb.type='button';rb.onclick=removeCur;const rr=el('div','row');rr.appendChild(rb);r.appendChild(rr)}
 if(msg){r.appendChild(el('p','hint',msg));return}
 r.appendChild(el('p','meta','Was it a good call?'));
 const row=el('div','row');
 [['bad','Bad call','line'],['good','Good call','main']].forEach(([v,l,c])=>{const b=el('button','btn '+c,l);b.type='button';b.onclick=()=>{cur.rating=v;showResult('Saved as a '+v+' call.');persist()};row.appendChild(b)});
 r.appendChild(row);
}
function addOpt(){
 if(spinning)return;const v=$('opt').value.trim();if(!v)return;
 if(S.options.includes(v)){$('msg').textContent='That option is already on the list.';return}
 S.options.push(v);$('opt').value='';$('msg').textContent='';persist();renderOpts();renderWheel();
}

function renderHistory(){
 const b=$('hlist');b.textContent='';
 const list=S.decisions.filter(d=>filter==='All'||d.category===filter);
 if(!list.length){b.appendChild(el('p','empty','No decisions yet.'));return}
 list.forEach(d=>{
  const c=el('div','item'),t=el('button','t');t.type='button';t.setAttribute('aria-expanded',String(openId===d.id));
  const l=el('div');l.appendChild(el('b',null,d.chosen));l.appendChild(el('p','meta',d.options.join(' • ')));l.appendChild(el('p','meta',d.category+' · '+fmt(d.createdAt)));
  t.appendChild(l);t.appendChild(el('span','tag '+(d.rating||'none'),d.rating==='good'?'Good':d.rating==='bad'?'Bad':'Unrated'));
  t.onclick=()=>{openId=openId===d.id?null:d.id;renderHistory()};c.appendChild(t);
  if(openId===d.id){
   const e=el('div','edit'),n=document.createElement('input');n.value=d.note||'';n.placeholder='Note';n.setAttribute('aria-label','Note');e.appendChild(n);
   const row=el('div','row');
   const act=(label,cls,fn)=>{const b=el('button','btn sm '+cls,label);b.type='button';b.onclick=()=>{fn();d.note=n.value;openId=null;renderHistory();persist()};row.appendChild(b)};
   act('Bad','line',()=>{d.rating='bad'});act('Good','line',()=>{d.rating='good'});act('Save','main',()=>{});
   act('Delete','line',()=>{S.decisions=S.decisions.filter(x=>x.id!==d.id)});
   e.appendChild(row);c.appendChild(e)}
  b.appendChild(c)});
}

function renderStats(){
 const b=$('slist');b.textContent='';const all=S.decisions;
 if(!all.length){b.appendChild(el('p','empty','Spin the wheel a few times and rate your calls to see stats here.'));return}
 const rate=l=>{const r=l.filter(d=>d.rating);return r.length?Math.round(r.filter(d=>d.rating==='good').length/r.length*100)+'%':null};
 const rated=all.filter(d=>d.rating),good=rated.filter(d=>d.rating==='good').length;
 const late=all.filter(d=>{const h=new Date(d.createdAt).getHours();return h>=22||h<6});
 const tiles=[[all.length,'Total decisions'],[rated.length,'Rated'],[rate(all)||'No data','Good call rate'],[good+' / '+(rated.length-good),'Good / bad'],[late.length?(rate(late)||'Not rated')+' ('+late.length+')':'No data','Late-night good rate']];
 const g=el('div','tiles');tiles.forEach(([v,l])=>{const t=el('div','tile');t.appendChild(el('div','v',String(v)));t.appendChild(el('div','l',l));g.appendChild(t)});b.appendChild(g);
 b.appendChild(el('h2',null,'By category'));
 const g2=el('div','tiles');CATS.forEach(c=>{const l=all.filter(d=>d.category===c);if(!l.length)return;const t=el('div','tile');t.appendChild(el('div','v',rate(l)?rate(l)+' good':'Not rated'));t.appendChild(el('div','l',c+' ('+l.length+')'));g2.appendChild(t)});b.appendChild(g2);
}

function show(t){
 tab=t;['decide','bill','history','stats'].forEach(k=>$(k).hidden=k!==t);
 [...$('nav').children].forEach(b=>b.getAttribute('data-t')===t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 if(t==='decide')renderWheel();if(t==='history'){renderFilter();renderHistory()}if(t==='stats')renderStats();if(t==='bill')renderBill();window.scrollTo(0,0);
}
function buildNav(){[['decide','🎲','Decide'],['bill','🧾','Bill'],['history','🕘','History'],['stats','📊','Stats']].forEach(([k,i,l])=>{const b=document.createElement('button');b.type='button';b.setAttribute('data-t',k);
 const s=el('span','ic',i);s.setAttribute('aria-hidden','true');b.appendChild(s);b.appendChild(document.createTextNode(l));b.onclick=()=>show(k);$('nav').appendChild(b)})}

function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tick(){if(!S.snd||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.value=700;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+.05)}catch(e){}}
function celebrate(){
 if(S.snd&&navigator.vibrate)navigator.vibrate([40,30,80]);
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const cv=$('conf'),w=cv.width=innerWidth,h=cv.height=innerHeight,c=cv.getContext('2d');cv.hidden=false;
 const P=Array.from({length:90},()=>({x:w/2,y:h*.35,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,s:5+Math.random()*5,c:COLORS[Math.floor(Math.random()*6)],r:Math.random()*6}));
 const t0=performance.now();
 (function f(now){c.clearRect(0,0,w,h);P.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=.2;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);c.restore()});
  if(now-t0<1800)requestAnimationFrame(f);else{c.clearRect(0,0,w,h);cv.hidden=true}})(t0);
}
const PACKS={'What to eat':{cat:'Food',o:['Adobo','Sinigang','Sisig','Lechon kawali','Pancit','Kare-kare','Tinola']},'Weekend plan':{cat:'Fun',o:['Basketball','Movie night','Road trip','Rest at home','Try a new cafe','Visit family']},'Who pays':{cat:'General',o:['Me','You','Split it','Rock-paper-scissors']},'Truth or dare':{cat:'Fun',o:['Truth','Dare','Pass','Double dare']}};
function renderPacks(){const b=$('packs');b.textContent='';Object.keys(PACKS).forEach(k=>{const x=el('button','chip',k);x.type='button';
 x.onclick=()=>{if(spinning)return;S.options=[...PACKS[k].o];cat=PACKS[k].cat;persist();renderCats();renderOpts();renderWheel();$('result').hidden=true;$('msg').textContent='Loaded "'+k+'". Spin!'};b.appendChild(x)})}
$('elim').onchange=e=>{tg=1;S.elim=e.target.checked;if(S.elim&&cur&&!cur.removed&&!spinning&&!$('result').hidden)removeCur();else persist()};
$('snd').onchange=e=>{tg=1;S.snd=e.target.checked;persist()};
let fs=null;const wb=$('wheelBox');
wb.addEventListener('pointerdown',e=>{if(e.target.closest('.stage'))fs={x:e.clientX,y:e.clientY,t:performance.now()}});
wb.addEventListener('pointerup',e=>{if(!fs)return;const d=Math.hypot(e.clientX-fs.x,e.clientY-fs.y),dt=performance.now()-fs.t;fs=null;if(d>50&&dt<600)spin()});
wb.addEventListener('pointercancel',()=>{fs=null});
let tip=0,sc=0,scv='',scu='%',bmode='split',busy=false,own={};
const money=x=>'₱'+x.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(){const a=Math.max(0,parseFloat($('amt').value)||0),t=a*tip/100,v=Math.max(0,parseFloat(scv)||0),c=scv!==''?(scu==='%'?a*v/100:v):a*sc/100;return{a,t,c,total:a+t+c}}
function svcPct(){return scv!==''?(scu==='%'?(parseFloat(scv)||0):null):sc}
function renderPeople(hi){const b=$('people');b.textContent='';
 S.people.forEach((p,i)=>{const t=el('div','pt'+(hi===i?' on':''));t.appendChild(el('span',null,p));
  const x=el('button','btn line sm','×');x.type='button';x.setAttribute('aria-label','Remove '+p);x.disabled=busy;x.onclick=()=>{S.people.splice(i,1);persist();renderBill()};t.appendChild(x);b.appendChild(t)})}
function renderBill(){
 chipRow($('tips'),['0%','5%','10%','15%','20%'],()=>tip+'%',c=>{if(busy)return;tip=parseInt(c);renderBill()});
 chipRow($('scs'),['0%','5%','10%','12%','15%'],()=>scv!==''?'':sc+'%',c=>{if(busy)return;sc=parseInt(c);scv='';$('scv').value='';renderBill()});
 const su=$('scu');su.textContent='';['%','₱'].forEach(u=>{const x=el('button',null,u);x.type='button';x.setAttribute('aria-pressed',String(scu===u));x.setAttribute('aria-label',u==='%'?'Percent of the bill':'Fixed amount in pesos');x.onclick=()=>{if(busy)return;scu=u;renderBill()};su.appendChild(x)});
 const mb=$('bmode');mb.textContent='';
 [['split','Equal'],['custom','By order'],['all','One pays'],['free','One free']].forEach(([k,l])=>{const x=el('button',null,l);x.type='button';x.setAttribute('aria-pressed',String(bmode===k));x.onclick=()=>{if(busy)return;bmode=k;renderBill()};mb.appendChild(x)});
 $('billGo').textContent=bmode==='split'||bmode==='custom'?'Split it':'Spin for the payer';
 renderPeople(-1);
 ownRows();renderSum();
}
const ownSum=()=>S.people.reduce((x,p)=>x+(parseFloat(own[p])||0),0);
function ownRows(){const b=$('own');b.hidden=bmode!=='custom';b.textContent='';if(bmode!=='custom')return;
 b.appendChild(el('p','meta','Enter what each person ordered for themselves. Anything left over, like shared dishes, is split equally.'));
 S.people.forEach(p=>{const r=el('div','orow');r.appendChild(el('span',null,p));const i=document.createElement('input');i.type='number';i.min='0';i.inputMode='decimal';i.placeholder='0.00';i.value=own[p]||'';i.setAttribute('aria-label',p+' own orders in pesos');
  i.oninput=()=>{own[p]=i.value;renderSum()};r.appendChild(i);b.appendChild(r)})}
function renderSum(){const {a,total}=calc(),n=S.people.length;
 let t=a?'Total with tip: '+money(total)+(n&&bmode!=='custom'?' ('+money(total/n)+' each if split equally)':''):'Enter the bill amount to see the split.';
 if(bmode==='custom'&&a){const u=ownSum(),sh=a-u;t+=sh<0?'. Orders add up to '+money(u)+', more than the bill.':'. Shared: '+money(sh)+(n?' ('+money(sh/n)+' each)':'')}
 $('sum').textContent=t}
function showBill(big,lines){const r=$('bres');r.textContent='';r.hidden=false;r.appendChild(el('div','big',big));lines.forEach(l=>r.appendChild(el('p','meta',l)))}
async function billGo(){
 if(busy)return;const {a,t,c,total}=calc(),n=S.people.length,m=$('bmsg');$('bres').hidden=true;m.textContent='';
 if(!a){m.textContent='Enter the bill amount first.';return}
 if(n<2){m.textContent='Add at least 2 names.';return}
 const sum='Bill '+money(a)+(c?' + service charge '+money(c)+(svcPct()!==null?' ('+svcPct()+'%)':''):'')+(tip?' + '+tip+'% tip ('+money(t)+')':'')+' = '+money(total);
 if(bmode==='split'){showBill(money(total/n)+' each',[sum,'Split between '+n+' people.']);return}
 if(bmode==='custom'){const u=ownSum();if(u>a){m.textContent='Orders add up to '+money(u)+', which is more than the bill.';return}
  const sh=(a-u)/n,f=total/a;showBill('Everyone pays their share',[...S.people.map(x=>x+': '+money(((parseFloat(own[x])||0)+sh)*f)),sum+'. The unassigned '+money(a-u)+' is shared equally.']);return}
 busy=true;$('billGo').disabled=true;audio();
 const w=Math.floor(Math.random()*n),steps=n*Math.ceil(18/n)+n*Math.floor(Math.random()*3)+w;
 for(let i=0;i<=steps;i++){renderPeople(i%n);tick();await new Promise(r=>setTimeout(r,Math.min(520,55*Math.pow(1.08,i))))}
 busy=false;$('billGo').disabled=false;renderPeople(w);const name=S.people[w];celebrate();
 if(bmode==='all')showBill(name+' pays',[sum,'Everyone else says thank you.']);
 else showBill(name+' eats free!',[sum,'The other '+(n-1)+' pay '+money(total/(n-1))+' each.']);
 S.decisions.unshift({id:Date.now().toString(36),options:[...S.people],chosen:name,category:'Bill',createdAt:new Date().toISOString(),rating:null,note:(bmode==='all'?'Pays ':'Eats free, bill ')+money(total)});persist();
}
function addPerson(){if(busy)return;const v=$('pn').value.trim();if(!v)return;
 if(S.people.some(x=>x.toLowerCase()===v.toLowerCase())){$('bmsg').textContent='That name is already on the list.';return}
 S.people.push(v);$('pn').value='';$('bmsg').textContent='';persist();renderBill()}
$('pnAdd').onclick=addPerson;$('pn').addEventListener('keydown',e=>{if(e.key==='Enter')addPerson()});
$('amt').addEventListener('input',()=>{if(!busy)renderBill()});$('billGo').onclick=billGo;$('scv').addEventListener('input',()=>{scv=$('scv').value;if(!busy)renderBill()});
$('addBtn').onclick=addOpt;$('opt').addEventListener('keydown',e=>{if(e.key==='Enter')addOpt()});$('spin').onclick=spin;
window.addEventListener('resize',()=>{if(tab==='decide'){if(S.options.length<2)renderWheel();else draw()}});

async function init(){
 buildNav();renderCats();renderPacks();renderOpts();show('decide');
 try{const c=window.claude;if(c&&c.use){const db=await c.use('db'),user=await c.use('user');
  if(db&&user){const id=await user.id();if(id){ref=db.collection('data/users/'+id).doc('pickforme');const s=await ref.get();if(s.exists){loaded=1;const d=s.data();S.decisions=d.decisions||[];if(!dirty){S.options=d.options||[];S.people=d.people||[]}if(!tg){S.elim=!!d.elim;S.snd=d.snd!==false}}}}}
 }catch(e){ref=null}
 if(!ref){try{const r=localStorage.getItem('pick-for-me');if(r){loaded=1;const d=JSON.parse(r);S.decisions=d.decisions||[];S.options=d.options||[];S.people=d.people||[];if(!tg){S.elim=!!d.elim;S.snd=d.snd!==false}}}catch(e){}}
 if(!loaded&&!dirty&&!S.options.length){S.options=[...PACKS['What to eat'].o];cat='Food';renderCats()}
 $('elim').checked=S.elim;$('snd').checked=S.snd;renderOpts();renderWheel();
}
init();
</script>
